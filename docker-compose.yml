services:
  postgres:
    image: postgres:16
    container_name: chudaco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chudaco
      POSTGRES_USER: chudaco
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432:5432"
    volumes:
      - chudaco-postgres-data:/var/lib/postgresql/data

  web:
    image: node:20-bookworm
    container_name: chudaco-web
    user: "1000:1000"
    working_dir: /workspace
    env_file:
      - .env
    environment:
      PORT: 3001
      GOOGLE_SERVICE_ACCOUNT_KEY_PATH: /workspace/studious-loader-506306-k2-d641df9f3ab4.json
    command: >
      sh -lc "corepack pnpm install --frozen-lockfile && corepack pnpm --filter @chudaco/db build && corepack pnpm --filter web build && corepack pnpm --filter web start"
    ports:
      - "3001:3001"
    volumes:
      - .:/workspace
      - ./studious-loader-506306-k2-d641df9f3ab4.json:/workspace/studious-loader-506306-k2-d641df9f3ab4.json:ro
    depends_on:
      - postgres
    restart: unless-stopped

  worker:
    image: node:20-bookworm
    container_name: chudaco-worker
    user: "1000:1000"
    working_dir: /workspace
    env_file:
      - .env
    command: >
      sh -lc "corepack pnpm install --frozen-lockfile && corepack pnpm --filter @chudaco/db build && corepack pnpm --filter worker build && corepack pnpm --filter worker start"
    volumes:
      - .:/workspace
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  chudaco-postgres-data: